project:
  type: website
  output-dir: _site
  execute-dir: project        # so every page can read data/ with the same path
  render:
    - "*.qmd"
    - "lecture-notes/*.qmd"
    - "lecture-slides/*.qmd"
    - "exercise-sessions/*.qmd"

website:
  title: "Applied Bayesian Econometrics"
  description: "Master-level course on Bayesian inference for economics and finance, University of Freiburg."
  site-url: "https://bayesian-econometrics.github.io/applied-bayesian-econometrics-homepage/"
  page-navigation: true
  sidebar:
    title: "Lectures"
    style: floating
    contents: "lecture-notes/*.qmd"
  navbar:
    background: primary
    logo: theme/freiburg_logo.svg
    logo-alt: "University of Freiburg"
    title: "Applied Bayesian Econometrics"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Course information"
        href: course-information.qmd
      - text: "Lectures"
        href: lecture-notes/index.qmd
      - text: "Exercises"
        href: exercise-sessions/index.qmd
  page-footer:
    left: "Applied Bayesian Econometrics &middot; University of Freiburg"
    center: "Prof. Dr. Roxana Halbleib &middot; Dr. Christoph Frey"
    right: "Statistik und Ökonometrie"

format:
  html:
    page-layout: article
    theme:
      - cosmo
      - theme/freiburg_web.scss
    toc: true
    toc-location: right
    toc-depth: 3
    code-copy: true
    smooth-scroll: true
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5em
